<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmando cuenta - Shopping El Cobre</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .confirm-card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background: #1a237e;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            margin-top: 1rem;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e0e0e0;
            border-top-color: #1a237e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="confirm-card">
        <div id="icon" class="icon"><i class="fas fa-spinner fa-pulse"></i></div>
        <h1 id="title">Confirmando cuenta...</h1>
        <div id="message">
            <div class="spinner"></div>
            <p>Verificando tu correo, por favor espera...</p>
        </div>
    </div>
    <script>
        const supabaseUrl = 'https://wmbryozvmnayviyanwoj.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtYnJ5b3p2bW5heXZpeWFud29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTkxMjEsImV4cCI6MjA5NTczNTEyMX0.5Ibd14JFEjaX-DusUWrd8Z8QmCx3nnzxKZgXoCVhNYk';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        window.onload = async () => {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const access_token = params.get('access_token');
            const refresh_token = params.get('refresh_token');
            const type = params.get('type');
            const msgDiv = document.getElementById('message');
            const iconDiv = document.getElementById('icon');
            const titleEl = document.getElementById('title');

            if (type === 'signup' && access_token) {
                try {
                    const { error } = await supabase.auth.setSession({ access_token, refresh_token });
                    if (error) throw error;
                    iconDiv.innerHTML = '<i class="fas fa-check-circle" style="color:#25d366;"></i>';
                    titleEl.innerText = '¡Cuenta confirmada!';
                    msgDiv.innerHTML = '<p>Tu cuenta ha sido verificada correctamente. Serás redirigido a la tienda en unos segundos...</p><a href="/" class="btn">Ir ahora</a>';
                    setTimeout(() => window.location.href = '/', 3000);
                } catch (err) {
                    iconDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#e53935;"></i>';
                    titleEl.innerText = 'Error al confirmar';
                    msgDiv.innerHTML = `<p>${err.message || 'El enlace es inválido o ha expirado. Puedes solicitar un nuevo correo de verificación desde la tienda.'}</p><a href="/" class="btn">Volver a la tienda</a>`;
                }
            } else {
                iconDiv.innerHTML = '<i class="fas fa-envelope" style="color:#ff9800;"></i>';
                titleEl.innerText = 'Enlace no válido';
                msgDiv.innerHTML = '<p>Este enlace no es para confirmar cuenta. Si tienes problemas, inicia sesión o solicita un nuevo correo.</p><a href="/" class="btn">Ir a la tienda</a>';
            }
        };
    </script>
</body>

</html>
