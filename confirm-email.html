<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmando cuenta - Shopping El Cobre</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .confirm-card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background: #1a237e;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            margin-top: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0f195e;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e0e0e0;
            border-top-color: #1a237e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            color: #e53935;
            background: #ffebee;
            padding: 12px;
            border-radius: 12px;
            margin-top: 1rem;
        }

        .success-msg {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 12px;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="confirm-card">
        <div id="icon" class="icon"><i class="fas fa-spinner fa-pulse"></i></div>
        <h1 id="title">Confirmando cuenta...</h1>
        <div id="message">
            <div class="spinner"></div>
            <p>Verificando tu correo, por favor espera...</p>
        </div>
    </div>

    <script>
        // Configuración de Supabase (igual que en config.js)
        const supabaseUrl = 'https://wmbryozvmnayviyanwoj.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtYnJ5b3p2bW5heXZpeWFud29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTkxMjEsImV4cCI6MjA5NTczNTEyMX0.5Ibd14JFEjaX-DusUWrd8Z8QmCx3nnzxKZgXoCVhNYk';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        window.onload = async () => {
            // Obtener tokens del fragmento de la URL (hash)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const access_token = params.get('access_token');
            const refresh_token = params.get('refresh_token');
            const type = params.get('type');

            const iconDiv = document.getElementById('icon');
            const titleEl = document.getElementById('title');
            const msgDiv = document.getElementById('message');

            // Si no hay tokens o no es de tipo signup, mostrar error
            if (!access_token || type !== 'signup') {
                iconDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#e53935;"></i>';
                titleEl.innerText = 'Enlace inválido';
                msgDiv.innerHTML = `
                <div class="error-msg">
                    <i class="fas fa-times-circle"></i> Este enlace no es válido o ha expirado.
                </div>
                <a href="/" class="btn">Volver a la tienda</a>
            `;
                return;
            }

            try {
                // Intentar establecer la sesión con los tokens
                const { error } = await supabase.auth.setSession({
                    access_token,
                    refresh_token
                });

                if (error) throw error;

                // Éxito: mostrar mensaje de confirmación
                iconDiv.innerHTML = '<i class="fas fa-check-circle" style="color:#25d366;"></i>';
                titleEl.innerText = '¡Cuenta confirmada!';
                msgDiv.innerHTML = `
                <div class="success-msg">
                    <i class="fas fa-check"></i> Tu cuenta ha sido verificada correctamente.
                </div>
                <p>Serás redirigido a la tienda en unos segundos...</p>
                <a href="/" class="btn">Ir ahora</a>
            `;
                // Redirigir después de 3 segundos
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            } catch (err) {
                console.error('Error confirmando cuenta:', err);
                iconDiv.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#e53935;"></i>';
                titleEl.innerText = 'Error al confirmar';
                msgDiv.innerHTML = `
                <div class="error-msg">
                    <i class="fas fa-times-circle"></i> ${err.message || 'El enlace es inválido o ha expirado. Puedes solicitar un nuevo correo desde la tienda.'}
                </div>
                <a href="/" class="btn">Volver a la tienda</a>
            `;
            }
        };
    </script>
</body>

</html>
